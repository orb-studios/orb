name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 04:00 UTC every 3 days (well within Supabase's 7-day pause window)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab

jobs:
  keepalive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database Table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Executing keep-alive query against Supabase PostgreSQL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/_keepalive?select=*" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase PostgREST Query Status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -ne 200 ]; then
            echo "::error::Supabase query returned status ${HTTP_STATUS}. Expected 200."
            exit 1
          fi

          echo "Supabase database successfully pinged and active!"
